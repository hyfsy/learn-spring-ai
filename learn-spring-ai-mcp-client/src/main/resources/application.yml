
server:
  port: 8074
  servlet:
    context-path: /
  tomcat:
    uri-encoding: UTF-8
spring:
  application:
    name: demo-ai-mcp-client
  ai:
    mcp:
      client:
        enabled: true
        name: mcp-client-${spring.application.name}
        version: 1.0.0
        request-timeout: 20s
        type: sync
        annotation-scanner:
          enabled: true
        root-change-notification: true
        toolcallback:
          enabled: true
